<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΩmegaWiki Knowledge Graph</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --border: #0f3460;
    --text: #e0e0e0;
    --muted: #888888;
    --legend-label: #bbbbbb;
    --input-bg: #1a1a2e;
    --accent: #4e79a7;
    --ctrl-text: #bbbbbb;
    --ctrl-hover-bg: #0f3460;
    --ctrl-hover-text: #ffffff;
    --info-text: #aaaaaa;
    --strong: #e0e0e0;
    --tooltip-shadow: rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; height: 100vh; overflow: hidden;
         background: var(--bg); color: var(--text); }

  /* ── Sidebar ── */
  #sidebar {
    width: 260px; min-width: 200px; padding: 14px 12px; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--border); display: flex;
    flex-direction: column; gap: 14px; font-size: 12px;
  }
  #sidebar h1 { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: 0.04em; }
  #sidebar h2 { font-size: 11px; font-weight: 600; text-transform: uppercase;
                letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }

  /* search */
  #search { width: 100%; padding: 5px 8px; border-radius: 4px;
            border: 1px solid var(--border); background: var(--input-bg); color: var(--text);
            font-size: 12px; outline: none; }
  #search:focus { border-color: var(--accent); }

  /* filter buttons */
  .filter-group { display: flex; flex-wrap: wrap; gap: 5px; }
  .filter-btn {
    padding: 3px 8px; border-radius: 12px; border: 1.5px solid transparent;
    cursor: pointer; font-size: 11px; font-weight: 500; transition: opacity 0.15s;
  }
  .filter-btn.off { opacity: 0.35; }

  /* stats */
  #stats { color: var(--muted); font-size: 11px; line-height: 1.6; }

  /* legend swatches */
  .swatch { display: inline-block; width: 10px; height: 10px;
            border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .edge-swatch { display: inline-block; width: 18px; height: 3px;
                 border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .legend-row { display: flex; align-items: center; margin-bottom: 4px; }
  .legend-label { font-size: 11px; color: var(--legend-label); }

  /* layout controls */
  #layout-btns { display: flex; flex-wrap: wrap; gap: 5px; }
  .ctrl-btn {
    padding: 4px 9px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--input-bg); color: var(--ctrl-text); cursor: pointer; font-size: 11px;
    transition: background 0.15s;
  }
  .ctrl-btn:hover { background: var(--ctrl-hover-bg); color: var(--ctrl-hover-text); }

  /* info panel */
  #info {
    flex: 1; background: var(--panel); border-radius: 4px; padding: 8px;
    font-size: 11px; color: var(--info-text); line-height: 1.5; overflow-y: auto;
    min-height: 80px; border: 1px solid var(--border);
  }
  #info b { color: var(--strong); }

  /* formatted graph hover card */
  #node-tooltip {
    position: absolute; z-index: 20; display: none;
    width: min(420px, calc(100% - 24px)); height: min(220px, calc(100vh - 24px));
    padding: 12px 14px; overflow-x: hidden; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--info-text);
    box-shadow: 0 8px 24px var(--tooltip-shadow);
    font-size: 13px; line-height: 1.55; white-space: normal; overflow-wrap: anywhere;
    scrollbar-gutter: stable;
  }
  #node-tooltip.visible { display: block; }
  #node-tooltip b { color: var(--strong); font-size: 14px; }
  .vis-tooltip { display: none !important; }

  /* ── Canvas ── */
  #network { position: relative; flex: 1; height: 100vh; }
</style>
</head>
<body>

<div id="sidebar">
  <h1>ΩmegaWiki Graph</h1>

  <div>
    <h2>Search</h2>
    <input id="search" type="text" placeholder="Filter nodes by name…">
  </div>

  <div>
    <h2>Node types</h2>
    <div class="filter-group" id="node-filters"></div>
  </div>

  <div>
    <h2>Edge types</h2>
    <div class="filter-group" id="edge-filters"></div>
  </div>

  <div>
    <h2>Layout</h2>
    <div id="layout-btns">
      <button class="ctrl-btn" onclick="setLayout('physics')">Physics</button>
      <button class="ctrl-btn" onclick="setLayout('hierarchical')">Hierarchy</button>
      <button class="ctrl-btn" onclick="network.fit()">Fit all</button>
      <button class="ctrl-btn" onclick="toggleEdgeLabels()">Labels</button>
    </div>
  </div>

  <div>
    <h2>Node legend</h2>
    <div id="node-legend"></div>
  </div>

  <div>
    <h2>Edge legend</h2>
    <div id="edge-legend"></div>
  </div>

  <div id="stats"></div>

  <div>
    <h2>Selected</h2>
    <div id="info">Click a node to see details.</div>
  </div>
</div>

<div id="network"></div>

kground": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "same_problem_as"}, {"id": 619, "from": "papers/if-you-thought-global-financial-crisis", "to": "concepts/ai-displacement-market-fragility", "label": "introduces concept", "title": "<b>introduces_concept</b><br>Op-ed introduces the labor-displacement -> net-negative retirement flows -> passive-fund forced-selling -> AI mega-cap crash transmission channel.", "color": {"color": "#f28e2b", "highlight": "#f28e2b", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "introduces_concept"}, {"id": 620, "from": "papers/if-you-thought-global-financial-crisis", "to": "concepts/software-intelligence-explosion", "label": "uses concept", "title": "<b>uses_concept</b><br>Relies on the premise that LLMs are 'coding their successors,' driving non-linear/exponential capability improvement that accelerates displacement.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 621, "from": "papers/if-you-thought-global-financial-crisis", "to": "papers/industrial-policy-intelligence-age", "label": "same problem as", "title": "<b>same_problem_as</b><br>Both address how society/policy must be reordered for AI-driven labor displacement; the op-ed names the 'end of the social contract' problem that the industrial-policy paper propos…", "color": {"color": "#888888", "highlight": "#888888", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "same_problem_as"}, {"id": 622, "from": "papers/claude-science-ai-workbench-scientists", "to": "concepts/automated-research-pipeline", "label": "uses concept", "title": "<b>uses_concept</b><br>Claude Science is an end-to-end agentic research workbench: a coordinating agent plus specialist sub-agents run multi-step research (literature -> analysis -> figures -> manuscript…", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 623, "from": "papers/claude-science-ai-workbench-scientists", "to": "concepts/ai-native-research-organization", "label": "uses concept", "title": "<b>uses_concept</b><br>Instantiates the AI-native lab at single-lab scale: reusable skills, actor-critic reviewer agents, and reproducible auditable artifacts embedded in the lab's own infrastructure.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 624, "from": "papers/how-ai-companies-pay-fair-rates", "to": "concepts/scaling-law-data-compensation", "label": "introduces concept", "title": "<b>introduces_concept</b><br>Proposes pricing training data from mixture weights (equimarginal principle) and scaling laws, distributing per-model operating profit via ASCAP/BMI-style CMOs.", "color": {"color": "#f28e2b", "highlight": "#f28e2b", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "introduces_concept"}, {"id": 625, "from": "papers/how-ai-companies-pay-fair-rates", "to": "concepts/sharing-ai-prosperity", "label": "uses concept", "title": "<b>uses_concept</b><br>Frames data compensation as a predistribution alternative to UBI, giving creators a productive stake in AI's upside rather than a welfare check.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 626, "from": "papers/loop-engineering", "to": "concepts/human-ai-division-labor-agentic-work", "label": "uses concept", "title": "<b>uses_concept</b><br>Three nested loops assign fast execution to coding agents and the slow, context-rich loops to humans; reframes the human moat as a 'context advantage' over the AI.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 627, "from": "papers/no-one-escapes-permanent-underclass", "to": "concepts/gradual-disempowerment", "label": "extends concept", "title": "<b>extends_concept</b><br>Extends the disempowerment thesis beyond labor to capital owners and the state, arguing even the overclass and government become materially unnecessary under aligned AI.", "color": {"color": "#4e79a7", "highlight": "#4e79a7", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "extends_concept"}, {"id": 628, "from": "papers/no-one-escapes-permanent-underclass", "to": "concepts/ai-evolution-and-natural-selection", "label": "uses concept", "title": "<b>uses_concept</b><br>Argues machine-run states win by natural selection ('there is no why'); competitive pressure removes humans from the loop regardless of intent.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 629, "from": "papers/no-one-escapes-permanent-underclass", "to": "concepts/post-labor-economy", "label": "uses concept", "title": "<b>uses_concept</b><br>Depicts a post-labor equilibrium where the state taxes an all-AI economy and pays welfare to a disempowered, economically unnecessary human population.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 630, "from": "papers/agentic-coding-persistent-returns-expertise", "to": "papers/loop-engineering", "label": "same problem as", "title": "<b>same_problem_as</b><br>Both dissect the human role in agentic coding: Ng's 'context advantage' held in the slow loops mirrors the persistent returns to human expertise (planning/judgment) as agents autom…", "color": {"color": "#888888", "highlight": "#888888", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "same_problem_as"}, {"id": 631, "from": "papers/two-radical-ways-share-ai-ownership", "to": "concepts/public-equity-ai", "label": "introduces concept", "title": "<b>introduces_concept</b><br>Proposes data equity (collective-bargaining safe harbor + equity) and public equity (PCO / public trust) as ownership-based ways to share AI value.", "color": {"color": "#f28e2b", "highlight": "#f28e2b", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": { gues barriers to sophisticated cyberattacks dropped: less-resourced actors can now run team-scale operations.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 653, "from": "papers/how-built-multi-agent-research-system", "to": "concepts/llm-powered-agent-architecture", "label": "uses concept", "title": "<b>uses_concept</b><br>Orchestrator-worker architecture: a lead agent plans and spawns parallel subagents with separate context windows.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 654, "from": "papers/how-built-multi-agent-research-system", "to": "concepts/parallel-agent-supervision", "label": "uses concept", "title": "<b>uses_concept</b><br>Lead agent delegates to and synthesizes results from parallel subagents; CitationAgent verifies attributions.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 655, "from": "papers/how-built-multi-agent-research-system", "to": "concepts/multi-agent-scaling-laws", "label": "uses concept", "title": "<b>uses_concept</b><br>Token usage alone explains ~80% of performance variance on BrowseComp; multi-agent works by scaling parallel token spend.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "s mation-augmentation-employment-divide", "label": "introduces concept", "title": "<b>introduces_concept</b><br>Documents that employment declines concentrate in AI-exposed occupations where AI automates (not augments) tasks, hitting early-career workers, via employment not wages.", "color": {"color": "#f28e2b", "highlight": "#f28e2b", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "introduces_concept"}, {"id": 660, "from": "papers/canaries-coal-mine-six-facts-about", "to": "concepts/post-labor-economy", "label": "uses concept", "title": "<b>uses_concept</b><br>Provides micro payroll evidence of AI-driven labor displacement for entry-level workers, grounding post-labor-economy projections.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 661, "from": "papers/genai-divide-state-ai-business-2025", "to": "concepts/genai-divide-enterprise-learning-gap", "label": "introduces concept", "title": "<b>introduces_concept</b><br>Defines the GenAI Divide (5% capture value, 95% zero P&L return) and the learning gap (systems don't retain feedback or adapt) as the core barrier.", "color": {"color": "#f28e2b", "highlight": "#f28e2b", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "introduces_concept"}, {"id": 662, "from": "papers/genai-divide-state-ai-business-2025", "to": "concepts/firm-level-ai-complementarities", "label": "uses concept", "title": "<b>uses_concept</b><br>Success determined by approach: process-specific customization, workflow integration, and outcome-based evaluation, not model quality.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 663, "from": "papers/genai-divide-state-ai-business-2025", "to": "concepts/ai-adoption-pressure-corporate-organizations", "label": "uses concept", "title": "<b>uses_concept</b><br>High pilot adoption but low scale-up; the enterprise paradox where big firms lead pilots yet lag production.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 664, "from": "papers/rethinking-organisation-when-knowledge-no-longer", "to": "concepts/cognitive-abundance", "label": "uses concept", "title": "<b>uses_concept</b><br>Premise that AI makes knowledge ubiquitous/near-free, dissolving knowledge-based organizational hierarchy.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 665, "from": "papers/rethinking-organisation-when-knowledge-no-longer", "to": "concepts/firm-level-ai-complementarities", "label": "uses concept", "title": "<b>uses_concept</b><br>Argues realized value requires org redesign around judgment/accountability, not just deploying AI tools.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth":  "<b>introduces_concept</b><br>Develops and names gradual disempowerment: incremental AI progress erodes human influence over economy, culture, and states irreversibly.", "color": {"color": "#f28e2b", "highlight": "#f28e2b", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "introduces_concept"}, {"id": 670, "from": "papers/gradual-disempowerment-systemic-existential-risks-incremental", "to": "concepts/post-labor-economy", "label": "uses concept", "title": "<b>uses_concept</b><br>Argues machine substitution across societal functions untethers institutional incentives from human flourishing.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 671, "from": "papers/frontier-models-capable-context-scheming", "to": "concepts/context-scheming", "label": "introduces concept", "title": "<b>introduces_concept</b><br>Demonstrates in-context scheming across five frontier models: subtle sabotage, oversight subversion, self-exfiltration, sandbagging, persistent deception.", "color": {"color": "#f28e2b", "highlight": "#f28e2b", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "introduces_concept"}, {"id": 672, "from": "papers/frontier-models-capable-context-scheming", "to": "concepts/broadly-safe-behavior-cluster", "label": "critiques concept", "title": "<b>critiques_concept</b><br>Shows frontier models can deliberately deceive and subvert oversight, undermining assumptions of broadly safe behavior.", "color": {"color": "#e15759", "highl s/some-simple-economics-agi", "to": "concepts/measurability-gap", "label": "introduces concept", "title": "<b>introduces_concept</b><br>Introduces the Measurability Gap (Delta m) between the automation and verification frontiers and derives the four-regime map from it.", "color": {"color": "#f28e2b", "highlight": "#f28e2b", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "introduces_concept"}, {"id": 756, "from": "papers/some-simple-economics-agi", "to": "concepts/codifier-curse", "label": "introduces concept", "title": "<b>introduces_concept</b><br>Names and models the Codifier's Curse and the Missing Junior Loop as laws of motion depleting the human experience stock S_nm.", "color": {"color": "#f28e2b", "highlight": "#f28e2b", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "introduces_concept"}, {"id": 757, "from": "papers/ai-native-firms", "to": "papers/some-simple-economics-agi", "label": "same problem as", "title": "<b>same_problem_as</b><br>Both address how organizations reshape when agentic execution is cheap; Kim & Koning measure the flatter, more senior firm shape that this model's regime map predicts.", "color": {"color": "#888888", "highlight": "#888888", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "same_problem_as"}, {"id": 758, "from": "papers/kosmyna-brain-chatgpt-cognitive-debt", "to": "papers/some-simple-economics-agi", "label": "same problem as", "title": "<b>same_problem_as</b><br>The Missing Junior Loop is the aggregate form of the individual competence erosion Kosmyna et al. measure as cognitive debt.", "color": {"color": "#888888", "highlight": "#888888", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "same_problem_as"}, {"id": 759, "from": "papers/messeri-crockett-ai-illusions-understanding", "to": "papers/some-simple-economics-agi", "label": "same problem as", "title": "<b>same_problem_as</b><br>Verification bandwidth is the economic counterpart of the illusion-of-understanding problem: plausible output that nobody is positioned to check.", "color": {"color": "#888888", "highlight": "#888888", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "same_problem_as"}, {"id": 760, "from": "papers/endoscopist-deskilling-risk-after-exposure-artificial", "to": "concepts/automation-induced-deskilling", "label": "introduces concept", "title": "<b>introduces_concept</b><br>First original study measuring deskilling from AI exposure on a patient-relevant endpoint: unassisted ADR fell 28.4% to 22.4%.", "color": {"color": "#f28e2b", "highlight": "#f28e2b", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "introduces_concept"}, {"id": 761, "from": "papers/endoscopist-deskilling-risk-after-exposure-artificial", "to": "concepts/codifier-curse", "label": "uses concept", "title": "<b>uses_concept</b><br>Provides the empirical instance for the expertise-erosion mechanism that the Codifier's Curse and Missing Junior Loop model abstractly.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 762, "from": "papers/endoscopist-deskilling-risk-after-exposure-artificial", "to": "papers/kosmyna-brain-chatgpt-cognitive-debt", "label": "same problem as", "title": "<b>same_problem_as</b><br>Both measure competence loss under routine AI assistance; Budzyn et al. on a clinical endpoint, Kosmyna et al. on neural connectivity and recall.", "color": {"color": "#888888", "highlight": "#888888", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "same_problem_as"}, {"id": 763, "from": "papers/racing-ruin", "to": "concepts/ai-race-dynamics", "label": "extends concept", "title": "<b>extends_concept</b><br>Gives the race a formal stopping-game treatment and derives when racing to certain disaster is self-enforcing as a function of transparency and trust.", "color": {"color": "#4e79a7", "highlight": "#4e79a7", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "extends_concept"}, {"id": 764, "from": "papers/anatomy-frontier-lab-agent-intrusion-technical", "to": "concepts/autonomous-offensive-cyber-operations", "label": "extends concept", "title": "<b>extends_concept</b><br>First detailed forensic account of an autonomous agent running an end-to-end intrusion (~17,600 actions over 4.5 days) against a live third party.", "color": {"color": "#4e79a7", "highlight": "#4e79a7", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "extends_concept"}, {"id": 765, "from": "papers/anatomy-frontier-lab-agent-intrusion-technical", "to": "concepts/societal-reward-hacking", "label": "uses concept", "title": "<b>uses_concept</b><br>The intrusion is read as an attempt to cheat the ExploitGym evaluation by stealing reference solutions rather than solving the challenge.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 766, "from": "papers/calculator-analogy-epistemic-virtues-using-llms", "to": "concepts/automation-induced-deskilling", "label": "critiques concept", "title": "<b>critiques_concept</b><br>Tests the calculator analogy and shows where it fails: unlike a calculator, an LLM simulates the activity it replaces, which changes the deskilling risk qualitatively.", "color": {"color": "#e15759", "highlight": "#e15759", "opacity": 0.75}, "dashes": true, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "critiques_concept"}, {"id": 767, "from": "papers/calculator-analogy-epistemic-virtues-using-llms", "to": "papers/messeri-crockett-ai-illusions-understanding", "label": "same problem as", "title": "<b>same_problem_as</b><br>Both target the gap between a system's performance of understanding and the user's actual understanding.", "color": {"color": "#888888", "highlight": "#888888", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "same_problem_as"}, {"id": 768, "from": "papers/intellektuelle-souver-nit-empfehlungen-die-hochschulbildung", "to": "concepts/automation-induced-deskilling", "label": "uses concept", "title": "<b>uses_concept</b><br>R "color": "#888888", "highlight": "#888888", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "same_problem_as"}, {"id": 790, "from": "papers/effect-chatgpt-students-learning-performance-learning", "to": "papers/more-than-10-000-research-papers", "label": "same problem as", "title": "<b>same_problem_as</b><br>Retracted 2026 for meta-analytic discrepancies; an instance of the post-publication correction load documented there.", "color": {"color": "#888888", "highlight": "#888888", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "same_problem_as"}, {"id": 791, "from": "papers/wissenschaft-im-zeitalter-ihrer-technischen-reproduzierbarkeit", "to": "concepts/automation-induced-deskilling", "label": "uses concept", "title": "<b>uses_concept</b><br>Argues LLMs let exhibition value be produced without cult value, i.e. scientific-looking text without the formative labour behind it.", "color": {"color": "#f5ac60", "highlight": "#f5ac60", "opacity": 0.75}, "dashes": false, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "uses_concept"}, {"id": 792, "from": "papers/wissenschaft-im-zeitalter-ihrer-technischen-reproduzierbarkeit", "to": "papers/bei-der-bewertung-von-forschungsqualit-vielleicht", "label": "challenges", "title": "<b>challenges</b><br>Calls for socializing the criteria of good science, against the position that quality standards must remain discipline-owned.", "color": {"color": "#e15759", "highlight": "#e15759", "opacity": 0.75}, "dashes": true, "arrows": "to", "font": {"size": 8, "color": "#555", "background": "rgba(255,255,255,0.85)", "strokeWidth": 0}, "smooth": {"type": "curvedCW", "roundness": 0.12}, "_etype": "challenges"}];

const NODE_COLORS = {"papers": {"background": "#4A90D9", "border": "#336497", "highlight": {"background": "#77abe2", "border": "#336497"}}, "concepts": {"background": "#EC4899", "border": "#a5326b", "highlight": {"background": "#f075b2", "border": "#a5326b"}}, "topics": {"background": "#E67E22", "border": "#a15817", "highlight": {"background": "#ec9e59", "border": "#a15817"}}, "people": {"background": "#2ECC71", "border": "#208e4f", "highlight": {"background": "#62d894", "border": "#208e4f"}}, "ideas": {"background": "#F39C12", "border": "#aa6d0c", "highlight": {"background": "#f6b44d", "border": "#aa6d0c"}}, "methods": {"background": "#84CC16", "border": "#5c8e0f", "highlight": {"background": "#a2d850", "border": "#5c8e0f"}}, "experiments": {"background": "#E74C3C", "border": "#a1352a", "highlight": {"background": "#ed786c", "border": "#a1352a"}}, "Summary": {"background": "#1ABC9C", "border": "#12836d", "highlight": {"background": "#53ccb4", "border": "#12836d"}}, "foundations": {"background": "#95A5A6", "border": "#687374", "highlight": {"background": "#afbbbc", "border": "#687374"}}};
const EDGE_COLORS = {"supports": "#59a14f", "contradicts": "#e15759", "extends": "#4e79a7", "builds_on": "#4e79a7", "extends_concept": "#4e79a7", "challenges": "#e15759", "critiques_concept": "#e15759", "addresses_gap": "#f28e2b", "derived_from": "#b07aa1", "inspired_by": "#edc948", "tested_by": "#76b7b2", "invalidates": "#d62728", "supersedes": "#9c755f", "cites": "#7b8ab8", "introduces_concept": "#f28e2b", "uses_concept": "#f5ac60", "same_problem_as": "#888888", "similar_method_to": "#8c6bb1"};
const NODE_DIRS   = ["papers", "concepts", "topics", "people", "ideas", "methods", "experiments", "Summary", "foundations"];
const EDGE_TYPES  = ["addresses_gap", "builds_on", "challenges", "contradicts", "critiques_concept", "derived_from", "extends", "extends_concept", "inspired_by", "introduces_concept", "same_problem_as", "similar_method_to", "supports", "uses_concept"];

// ── State ────────────────────────────────────────────────────────────────────
const hiddenNodeTypes = new Set();
const hiddenEdgeTypes = new Set();
let showEdgeLabels = true;
let searchQuery = "";

// ── vis.js datasets ──────────────────────────────────────────────────────────
// Titles are rendered by the custom HTML tooltip below. Omitting them from both
// datasets prevents vis-network from showing the markup as plain text.
function graphItems(items) {
  return items.map(({ title, ...item }) => item);
}

const nodesDS = new vis.DataSet(graphItems(ALL_NODES));
const edgesDS = new vis.DataSet(graphItems(ALL_EDGES));

const container = document.getElementById("network");
const data = { nodes: nodesDS, edges: edgesDS };

const options = {
  physics: {
    enabled: true,
    forceAtlas2Based: {
      gravitationalConstant: -60,
      centralGravity: 0.005,
      springLength: 120,
      springConstant: 0.06,
      damping: 0.5,
      avoidOverlap: 0.4,
    },
    solver: "forceAtlas2Based",
    stabilization: { iterations: 300, updateInterval: 25 },
  },
  interaction: {
    hover: true,
    tooltipDelay: 150,
    navigationButtons: true,
    keyboard: { enabled: true, bindToWindow: false },
  },
  nodes: { shape: "dot", borderWidth: 1.5, shadow: { enabled: true, size: 4, x: 2, y: 2 } },
  edges: { width: 1.5, selectionWidth: 2.5 },
};

const network = new vis.Network(container, data, options);

// ── Hover → formatted, scrollable tooltip ─────────────────────────────────────
const nodeTooltip = document.createElement("div");
nodeTooltip.id = "node-tooltip";
nodeTooltip.setAttribute("role", "tooltip");
container.appendChild(nodeTooltip);
let tooltipHideTimer;

function showGraphTooltip(item, pointer) {
  if (!item) return;

  clearTimeout(tooltipHideTimer);
  nodeTooltip.innerHTML = item.title;
  nodeTooltip.classList.add("visible");

  const gap = 16;
  const margin = 12;
  const width = nodeTooltip.offsetWidth;
  const height = nodeTooltip.offsetHeight;
  let left = pointer.x + gap;
  let top = pointer.y + gap;

  if (left + width + margin > container.clientWidth) left = pointer.x - width - gap;
  if (top + height + margin > container.clientHeight) top = pointer.y - height - gap;

  nodeTooltip.style.left = `${Math.max(margin, left)}px`;
  nodeTooltip.style.top = `${Math.max(margin, top)}px`;
}

function scheduleTooltipHide() {
  clearTimeout(tooltipHideTimer);
  tooltipHideTimer = setTimeout(() => nodeTooltip.classList.remove("visible"), 180);
}

network.on("hoverNode", params => {
  showGraphTooltip(ALL_NODES.find(node => node.id === params.node), params.pointer.DOM);
});
network.on("hoverEdge", params => {
  showGraphTooltip(ALL_EDGES.find(edge => edge.id === params.edge), params.pointer.DOM);
});
network.on("blurNode", scheduleTooltipHide);
network.on("blurEdge", scheduleTooltipHide);
nodeTooltip.addEventListener("mouseenter", () => clearTimeout(tooltipHideTimer));
nodeTooltip.addEventListener("mouseleave", scheduleTooltipHide);
nodeTooltip.addEventListener("pointerdown", event => event.stopPropagation());

// ── Click → info panel ────────────────────────────────────────────────────────
network.on("click", function(params) {
  const info = document.getElementById("info");
  if (params.nodes.length > 0) {
    const nid = params.nodes[0];
    const node = ALL_NODES.find(n => n.id === nid);
    if (node) info.innerHTML = node.title;
  } else if (params.edges.length > 0) {
    const eid = params.edges[0];
    const edge = ALL_EDGES.find(e => e.id === eid);
    if (edge) info.innerHTML = edge.title;
  } else {
    info.textContent = "Click a node to see details.";
  }
});

// ── Filtering ────────────────────────────────────────────────────────────────
function applyFilters() {
  const q = searchQuery.toLowerCase();

  const filteredNodes = ALL_NODES
    .filter(n => !hiddenNodeTypes.has(n.group))
    .filter(n => !q || n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q));

  const visibleIds = new Set(filteredNodes.map(n => n.id));

  const filteredEdges = ALL_EDGES
    .filter(e => !hiddenEdgeTypes.has(e._etype))
    .filter(e => visibleIds.has(e.from) && visibleIds.has(e.to));

  nodesDS.clear(); nodesDS.add(graphItems(filteredNodes));
  edgesDS.clear(); edgesDS.add(graphItems(filteredEdges));
  updateStats(filteredNodes.length, filteredEdges.length);
}

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", function() {
  searchQuery = this.value.trim();
  applyFilters();
});

// ── Node type filter buttons ──────────────────────────────────────────────────
const nodeFilterDiv = document.getElementById("node-filters");
NODE_DIRS.forEach(type => {
  const count = ALL_NODES.filter(n => n.group === type).length;
  if (count === 0) return;
  const col = NODE_COLORS[type];
  const btn = document.createElement("button");
  btn.className = "filter-btn";
  btn.textContent = `${type} (${count})`;
  btn.style.background = col.background;
  btn.style.color = "#fff";
  btn.style.borderColor = col.border;
  btn.dataset.type = type;
  btn.onclick = () => {
    if (hiddenNodeTypes.has(type)) { hiddenNodeTypes.delete(type); btn.classList.remove("off"); }
    else { hiddenNodeTypes.add(type); btn.classList.add("off"); }
    applyFilters();
  };
  nodeFilterDiv.appendChild(btn);
});

// ── Edge type filter buttons ──────────────────────────────────────────────────
const edgeFilterDiv = document.getElementById("edge-filters");
EDGE_TYPES.forEach(etype => {
  const count = ALL_EDGES.filter(e => e._etype === etype).length;
  if (count === 0) return;
  const col = EDGE_COLORS[etype] || "#999";
  const btn = document.createElement("button");
  btn.className = "filter-btn";
  btn.textContent = `${etype.replace("_", " ")} (${count})`;
  btn.style.background = col;
  btn.style.color = "#fff";
  btn.style.borderColor = col;
  btn.dataset.etype = etype;
  btn.onclick = () => {
    if (hiddenEdgeTypes.has(etype)) { hiddenEdgeTypes.delete(etype); btn.classList.remove("off"); }
    else { hiddenEdgeTypes.add(etype); btn.classList.add("off"); }
    applyFilters();
  };
  edgeFilterDiv.appendChild(btn);
});

// ── Node legend ───────────────────────────────────────────────────────────────
const nodeLegend = document.getElementById("node-legend");
NODE_DIRS.forEach(type => {
  const count = ALL_NODES.filter(n => n.group === type).length;
  if (count === 0) return;
  const col = NODE_COLORS[type]?.background || "#aaa";
  nodeLegend.innerHTML += `<div class="legend-row">
    <span class="swatch" style="background:${col}"></span>
    <span class="legend-label">${type} <span style="color:#666">(${count})</span></span>
  </div>`;
});

// ── Edge legend ───────────────────────────────────────────────────────────────
const edgeLegend = document.getElementById("edge-legend");
EDGE_TYPES.forEach(etype => {
  const count = ALL_EDGES.filter(e => e._etype === etype).length;
  if (count === 0) return;
  const col = EDGE_COLORS[etype] || "#999";
  edgeLegend.innerHTML += `<div class="legend-row">
    <span class="edge-swatch" style="background:${col}"></span>
    <span class="legend-label">${etype.replace("_", " ")} <span style="color:#666">(${count})</span></span>
  </div>`;
});

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats(nc, ec) {
  document.getElementById("stats").innerHTML =
    `Showing <b>${nc}</b> nodes &nbsp;·&nbsp; <b>${ec}</b> edges`;
}
updateStats(ALL_NODES.length, ALL_EDGES.length);

// ── Layout switcher ───────────────────────────────────────────────────────────
function setLayout(mode) {
  if (mode === "hierarchical") {
    network.setOptions({
      layout: { hierarchical: { enabled: true, direction: "UD", sortMethod: "directed", nodeSpacing: 120 } },
      physics: { enabled: false },
    });
  } else {
    network.setOptions({
      layout: { hierarchical: { enabled: false } },
      physics: { enabled: true, solver: "forceAtlas2Based" },
    });
  }
}

// ── Edge label toggle ─────────────────────────────────────────────────────────
function toggleEdgeLabels() {
  showEdgeLabels = !showEdgeLabels;
  const updates = ALL_EDGES.map(e => ({ id: e.id, label: showEdgeLabels ? e.label : "" }));
  edgesDS.update(updates);
}
</script>
